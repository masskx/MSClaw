[project]
name = "msclaw"
version = "0.1.0"
description = "A maintainable personal AI agent built with Telegram and the Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.10,<4.0",
    "claude-agent-sdk>=0.1.31",
    "croniter>=6.0.0",
    "fastapi>=0.141.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.6",
    "uvicorn>=0.51.0",
]

[project.scripts]
msclaw = "msclaw.telegram_app:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msclaw"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
