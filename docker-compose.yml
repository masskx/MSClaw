services:
  bot:
    build: .
    command: msclaw
    env_file: .env
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
    restart: unless-stopped

  web:
    build: .
    command: uvicorn msclaw.web.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
    restart: unless-stopped
